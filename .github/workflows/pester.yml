name: Pester

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser
      - name: Restore locked dependencies
        shell: pwsh
        run: ./scripts/Restore-TaskScaffoldDependencies.ps1
      - name: Run tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI -Output Detailed
